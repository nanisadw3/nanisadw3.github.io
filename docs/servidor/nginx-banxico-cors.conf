# CORS for the public mcp-banxico endpoint, so inakisobera.me can call it from the browser.
#
# 1. Copy this file to /etc/nginx/conf.d/mcp-banxico-cors.conf (the two `map` blocks).
# 2. Add the lines marked "ADD" inside `location /mcp { ... }` in
#    /etc/nginx/sites-enabled/mcp-banxico.
# 3. sudo nginx -t && sudo systemctl reload nginx
#
# Why the Origin rewrite: the MCP Python SDK rejects requests whose Origin header isn't the
# server's own host (DNS-rebinding protection). For the allowed site origins nginx answers CORS
# itself and forwards the request without Origin; every other origin is passed through untouched,
# so the SDK keeps rejecting it.

map $http_origin $banxico_cors_origin {
    default                    "";
    "https://inakisobera.me"   $http_origin;
    "http://localhost:4321"    $http_origin;
    "http://127.0.0.1:4321"    $http_origin;
}

map $http_origin $banxico_upstream_origin {
    default                    $http_origin;
    "https://inakisobera.me"   "";
    "http://localhost:4321"    "";
    "http://127.0.0.1:4321"    "";
}

