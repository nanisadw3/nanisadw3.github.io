<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source of public/og-card.jpg (?lang=es) and public/og-card-en.jpg (?lang=en). Rebuild: npm run og -->
<style>
  @font-face { font-family: Inter; src: url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: JBM; src: url(../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 100 800; }
  :root { --bg:#1a1b26; --fg:#c0caf5; --fg2:#a9b1d6; --dim:#565f89; --blue:#7aa2f7; --cyan:#7dcfff; --mag:#bb9af7; --green:#9ece6a; --orange:#ff9e64; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: Inter, sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 48px 48px; }
  .grad { background: linear-gradient(90deg, var(--mag), var(--blue) 55%, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .name { font-family: JBM; font-weight: 800; color: #e3e8ff; letter-spacing: -1.5px; line-height: 1.02; }
  .role { font-weight: 600; color: var(--fg); }
  .status { font-family: JBM; color: var(--green); display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 14px var(--green); }
  .url { font-family: JBM; color: #e3e8ff; font-weight: 700; }
  .ring { border-radius: 50%; padding: 7px; background: linear-gradient(135deg, var(--mag), var(--blue), var(--cyan)); box-shadow: 0 0 60px #7aa2f755; }
  .ring img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 6px solid var(--bg); }

  /* big logo left, name under it; photo in a large circle on the right */
  .grid { -webkit-mask-image: linear-gradient(90deg, #000, transparent 70%); }
  .logo { position: absolute; left: 72px; top: 60px; width: 190px; height: 190px; border-radius: 44px; box-shadow: 0 20px 60px -10px #000, 0 0 0 1px #414868; }
  .text { position: absolute; left: 72px; top: 290px; }
  .name { font-size: 62px; }
  .role { font-size: 28px; margin-top: 16px; }
  .ring { position: absolute; right: 90px; top: 95px; width: 400px; height: 400px; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 36px; display: flex; justify-content: space-between; font-size: 22px; }


</style>
</head>
<body>
  <div class="grid"></div>
  <img class="logo" src="../public/favicon.svg" alt="">
  <div class="text">
    <div class="name">Iñaki<br><span class="grad">Sobera Sotomayor</span></div>
    <p class="role" data-t="role"></p>
  </div>
  <div class="ring"><img src="../cv/foto.jpg" alt=""></div>
  <div class="foot"><span class="status"><span class="dot"></span><span data-t="status"></span></span><span class="url">inakisobera.me</span></div>

  <script>
    const t = {
      es: { role: "Ingeniero de IA · RAG, agentes y MCP", status: "abierto a roles de IA" },
      en: { role: "AI Engineer · RAG, agents and MCP", status: "open to AI roles" },
    };
    const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "es";
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[lang][el.dataset.t]));
  </script>
</body>
</html>
