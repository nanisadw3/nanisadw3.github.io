<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Iñaki Sobera brand mark: a small network (an agent and its tools) whose top node is the dot of an "i". -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0d0e14"/>
  <g stroke="#7aa2f7" stroke-width="2.6" stroke-linecap="round" stroke-opacity=".7">
    <line x1="32" y1="17" x2="15" y2="31"/>
    <line x1="32" y1="17" x2="49" y2="31"/>
    <line x1="15" y1="31" x2="32" y2="50"/>
    <line x1="49" y1="31" x2="32" y2="50"/>
    <line x1="32" y1="17" x2="32" y2="50"/>
  </g>
  <circle cx="15" cy="31" r="5" fill="#bb9af7"/>
  <circle cx="49" cy="31" r="5" fill="#7dcfff"/>
  <circle cx="32" cy="50" r="5.5" fill="#7aa2f7"/>
  <circle cx="32" cy="17" r="11.5" fill="none" stroke="#7dcfff" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="32" cy="17" r="7.5" fill="url(#top)"/>
</svg>
