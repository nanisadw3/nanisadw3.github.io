name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuild every day so GitHub stats, PyPI downloads and Xerebro coverage stay current.
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch live data
        # Each source falls back to the committed src/data/live.json if it fails.
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XEREBRO_TOKEN: ${{ secrets.XEREBRO_TOKEN }}

      - name: Build with Astro
        run: npm run build

      - name: Test
        run: npm test

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          cname: inakisobera.me
